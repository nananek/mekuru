[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-core = { version = "=0.5.5", default-features = false }
